summary: >-
  Truepill (FuzeRx) publishes NO first-party client libraries. The developer
  documentation at rxdocs.fuzehealth.com shows only raw curl and browser fetch()
  examples and never references an SDK, and the company GitHub org
  (github.com/truepill) contains six repositories, none of which is an API
  client — they are generic OSS tools and forks (node-libxml, openapi-to-joi,
  rum-react-integration, phantomized, netlify-plugin-cypress, sinon-mongoose).
  The FuzeHealth org (github.com/FuzeHealth) holds a single .github profile repo.
  One THIRD-PARTY Ruby client exists on RubyGems, published by Cerebral Inc.,
  and it has not been released since February 2022.
