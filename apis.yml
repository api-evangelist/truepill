- aid: truepill:truepill-fulfillment-api
  name: Truepill Fulfillment API
  description: >-
    Fill requests, orders, NDC availability, prescribers, same-day delivery and specialty-pharmacy
    routing — the dispensing core of the FuzeRx platform. 42 operations. Submissions are accepted
    asynchronously and resolve as ORDER and SHIPMENT webhook events.
  humanURL: https://rxdocs.fuzehealth.com
  baseURL: https://rxapi.fuzehealth.com/v1
  tags:
  - Fulfillment
  - Dispensing
  - Order
  - Shipping
  tags_raw:
