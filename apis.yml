- aid: truepill:truepill-shipments-fulfillment-api
  name: Truepill Shipments & Fulfillment API
  tags:
  - Shipments
  - Fulfillment
  - Dispensing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://healthbrands.truepill.com/
  baseURL: https://rxapi.fuzehealth.com/v1
  properties:
  - url: https://rxdocs.fuzehealth.com
    type: Documentation
  - url: openapi/truepill-openapi.yml
