aid: truepill
url: https://raw.githubusercontent.com/api-evangelist/truepill/refs/heads/main/apis.yml
name: Truepill
kind: company
description: Truepill is a pharmacy and healthcare-infrastructure company providing
  API-driven prescription fulfillment, pharmacy dispensing, insurance/copay
  adjudication, telehealth, and at-home diagnostics. Following LetsGetChecked's
  2024 acquisition of Truepill, the combined company rebranded as Fuze Health in
  May 2025, and the developer platform now ships as FuzeRx. The REST API exposes
  JSON endpoints for patients, prescriptions, transfers, insurance/copay, and
  webhook events under https://rxapi.fuzehealth.com/v1.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Pharmacy
- Healthcare
- Prescription Fulfillment
- Telehealth
- Diagnostics
- Insurance
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: truepill:truepill-patients-api
  name: Truepill Patients API
  tags:
  - Patients
  - Demographics
  - Eligibility
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://rxdocs.fuzehealth.com
  baseURL: https://rxapi.fuzehealth.com/v1
  properties:
  - url: https://rxdocs.fuzehealth.com
    type: Documentation
  - url: openapi/truepill-openapi.yml
    type: OpenAPI
  - url: collections/truepill.postman_collection.json
    type: PostmanCollection
  - url: collections/truepill.opencollection.json
    type: OpenCollection
  description: Create, update, retrieve, and search patient records (demographics,
    address, contact, language preference) and list a patient's prescriptions. Patients
    are referenced by an opaque patient_token.
- aid: truepill:truepill-prescriptions-orders-api
