- aid: truepill:truepill-media-api
  name: Truepill Media API
  description: >-
    File records for patient identification photos and selfies, backed by Google Cloud Storage signed
    URLs — the API mints a read or write signed URL and the client transfers the bytes directly, so
    no image data transits the API itself. Both v1 and v2 are live.
  humanURL: https://rxdocs.fuzehealth.com
  baseURL: https://rxapi.fuzehealth.com/v1
