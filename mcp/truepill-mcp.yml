provider: Truepill
providerId: truepill
summary: >-
  Truepill / Fuze Health ships NO MCP server. Searches of the provider documentation
  (rxdocs.fuzehealth.com, rx.fuzehealth.com/api-docs), the github.com/truepill and
  github.com/FuzeHealth organizations, npm (@truepill/*, @fuzehealth/*, fuzerx), PyPI and the
  public MCP registries returned nothing, and no MCP endpoint is advertised on any Truepill or
  Fuze Health host. The tools below are a CANDIDATE surface derived by API Evangelist from the
  provider's own published Swagger contract — they are a proposal for what a FuzeRx MCP server
  would expose, not something an agent can call today. Every tool names the exact operationId it
  would bind to, so each inherits a real inputSchema from the spec rather than a guessed one.
search:
  date: '2026-08-15'
  queried:
  - https://rxdocs.fuzehealth.com
  - https://rx.fuzehealth.com/api-docs
  - https://github.com/truepill
  - https://github.com/FuzeHealth
  - npm registry (truepill, fuzerx, fuzehealth, @truepill/*)
  - PyPI (truepill, fuzerx)
  - public MCP server registries / directories
  result: no official or community MCP server found
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: >-
    mode is `none` because nobody ships a server. If FuzeRx ever publishes one, auth would be the
    same provisioned `Authorization: ApiKey <key>` header the REST API uses — there is no OAuth
    authorization server on any host (/.well-known/oauth-authorization-server returns the global
    401 API-key challenge).
server:
  name: truepill
  transport: null
  url: null
apis_yml_pointer:
  emitted: false
  reason: >-
    NO `type: MCPServer` pointer is emitted in apis.yml for this provider. That pointer asserts the
    PROVIDER operates an MCP server, and Truepill / Fuze Health does not. Wiring it for a derived
    candidate would credit them with an agent surface an agent cannot reach — the same rule this
    pipeline applies to WellKnown and AgentCard. This file stands as the honest record that the
    surface was looked for, was not found, and what one would look like if it existed.
agent_safety:
  note: >-
    This API dispenses controlled and non-controlled medication to real people. Any MCP server
    built over it must treat the write operations below as safety-critical: there is no
    idempotency key, so a retried tool call can dispense a second prescription. See
    conventions/truepill-conventions.yml and agentic-access/truepill-agentic-access.yml.
  human_in_the_loop_recommended:
  - create_fill_request
  - create_order
  - create_transfer_request
  - create_direct_transfer
  - discontinue_prescription
  - transfer_out_prescription
