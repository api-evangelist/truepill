      operationId: getV2MediaId
      parameters:
      - description: Should be a uuid
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
      tags:
      - v2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model75'
        '401':
          description: Unauthorized
