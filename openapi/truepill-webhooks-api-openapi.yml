        error Direct Transfer webhook event will be sent.<br/><br/>Direct Transfer Webhook Events are
        sent with text `DIRECT_TRANSFER` in the `callback_type` field and, like with other webhook events,
        the `status` field indicating whether or not it was successful.<br/><br/>In an error webhook event
        for a Direct Transfer, the `prescription_token` will not be provided as it was unable to be added
        into the Truepill system.
      operationId: getV1Direct_transferDirect_transfer_tokenWebhook_events
      tags:
      - webhooks
      parameters:
      - name: direct_transfer_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
