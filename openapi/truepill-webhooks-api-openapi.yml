              schema:
                $ref: '#/components/schemas/Model50'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model51'
  /v1/webhook_events:
    get:
      summary: List all Webhook Events
      operationId: getV1Webhook_events
      tags:
      - webhooks
      parameters:
      - name: timestamp
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model37'
  /v1/webhook_events/{webhook_type}:
    get:
      summary: List NotifyRx Webhook Events
      description: Webhook Events can be retrieved via API to be reprocessed.<br/><br/>This endpoint returns
        a list of webhook events and allows for the use of query parameters to scope the results of the
        request. A request `payload` represents the request's timestamp, type, and details. A request's
        `delivery_data` represents the request's status information.<br/><br/>Supported `webhook_types`
        are `notify_rx`
      operationId: getV1Webhook_eventsWebhook_type
      tags:
      - webhooks
      parameters:
      - name: webhook_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - notify_rx
          - FILE
          - CONSULT
          - CONSULT_TASK
          - CONTACT
          - TRANSFER_OUT
          - VISIT
      - name: timestamp
        in: query
