openapi: 3.0.3
info:
  title: Truepill Webhooks API
  description: 'Asynchronous event retrieval by webhook type and per direct transfer / fill request.


    Harvested verbatim from the live Truepill (FuzeRx) Swagger 2.0 contract published at https://rxapi.fuzehealth.com/swagger.json
    and split by resource domain. Operation summaries, descriptions, parameters, schemas and response
    codes are the provider''s own; only the Swagger 2.0 -> OpenAPI 3.0.3 conversion and the domain split
    are ours.'
  version: 0.0.1
  contact:
    name: FuzeRx Support
    url: https://rxdocs.fuzehealth.com
servers:
- url: https://rxapi.fuzehealth.com
  description: Production
security:
- apiKey: []
tags:
- name: webhooks
  description: Asynchronous event retrieval by webhook type and per direct transfer / fill request.
paths:
  /api/v1/direct_transfer/{direct_transfer_token}/webhook_events:
    get:
      summary: Get Direct Transfer webhook events by token
      description: You will receive a Notify Rx Webhook Event for each prescription that is transferred
        to Truepill.<br/><br/>After a Direct Transfer Request has been successfully completed, you will
        receive a Notify Rx Webhook Event for the prescription transferred to Truepill, along with a Direct
        Transfer webhook event. This will contain the `prescription_token` to utilize the prescription
        within Truepill.<br/><br/>If a Direct Transfer is unable to be successfully processed, only an
        error Direct Transfer webhook event will be sent.<br/><br/>Direct Transfer Webhook Events are
        sent with text `DIRECT_TRANSFER` in the `callback_type` field and, like with other webhook events,
        the `status` field indicating whether or not it was successful.<br/><br/>In an error webhook event
        for a Direct Transfer, the `prescription_token` will not be provided as it was unable to be added
        into the Truepill system.
      operationId: getApiV1Direct_transferDirect_transfer_tokenWebhook_events
      tags:
      - webhooks
      parameters:
      - name: direct_transfer_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model100'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model48'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model49'
  /api/v1/fill_request/{url_token}/webhook_events:
    get:
      summary: Get list of webhook events
      description: Return a list of webhook events and allows for the use of query parameters to scope
        the results of the request<br/><br/>A request payload represents the request's timestamp, type,
        and details.<br/><br/>A request's delivery_data represents the request's status information.
      operationId: getApiV1Fill_requestUrl_tokenWebhook_events
      tags:
      - webhooks
      parameters:
      - name: url_token
        in: path
        required: true
        schema:
          type: string
      - name: timestamp
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model103'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model50'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model51'
  /api/v1/webhook_events:
    get:
      summary: List all Webhook Events
      operationId: getApiV1Webhook_events
      tags:
      - webhooks
      parameters:
      - name: timestamp
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model37'
  /api/v1/webhook_events/{webhook_type}:
    get:
      summary: List NotifyRx Webhook Events
      description: Webhook Events can be retrieved via API to be reprocessed.<br/><br/>This endpoint returns
        a list of webhook events and allows for the use of query parameters to scope the results of the
        request. A request `payload` represents the request's timestamp, type, and details. A request's
        `delivery_data` represents the request's status information.<br/><br/>Supported `webhook_types`
        are `notify_rx`
      operationId: getApiV1Webhook_eventsWebhook_type
      tags:
      - webhooks
      parameters:
      - name: webhook_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - notify_rx
          - FILE
          - CONSULT
          - CONSULT_TASK
          - CONTACT
          - TRANSFER_OUT
          - VISIT
      - name: timestamp
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: request_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model74'
  /v1/direct_transfer/{direct_transfer_token}/webhook_events:
    get:
      summary: Get Direct Transfer webhook events by token
      description: You will receive a Notify Rx Webhook Event for each prescription that is transferred
