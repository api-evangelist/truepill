  /v1/direct_transfer/{direct_transfer_token}/webhook_events:
    get:
      summary: Get Direct Transfer webhook events by token
      operationId: getV1Direct_transferDirect_transfer_tokenWebhook_events
      description: 'You will receive a Notify Rx Webhook Event for each prescription that is transferred to Truepill.


        After a Direct Transfer Request has been successfully completed, you will receive a Notify Rx Webhook Event for the prescription transferred to Truepill, along with a Direct Transfer webhook event. This will contain the `prescription_token` to utilize the prescription within Truepill.


        If a Direct Transfer is unable to be successfully processed, only an error Direct Transfer webhook event will be sent.


        Direct Transfer Webhook Events are sent with text `DIRECT_TRANSFER` in the `callback_type` field and, like with other webhook events, the `status` field indicating whether or not it was successful.


        In an error webhook event for a Direct Transfer, the `prescription_token` will not be provided as it was unable to be added into the Truepill system.'
      parameters:
      - name: direct_transfer_token
        in: path
        required: true
        schema:
          type: string
      tags:
      - Direct Transfer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model100'
        '403':
