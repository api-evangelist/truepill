components:
  schemas:
    delivery_data:
      type: object
      properties:
        status:
          type: string
          example: success
        status_code:
          type: number
          example: 204
    Model139:
      type: object
      description: Prescription description
      properties:
        medication_name:
          type: string
          description: Medication name
          example: Finasteride
        quantity_written:
          type: string
          description: Written medication quantity
          example: '60'
        quantity_dispensed:
          type: string
          description: Dispensed medication
          example: '60'
        medication_sig:
          type: string
          description: Recommendations for medicines
          example: Apply daily.
        written_date:
          type: string
          description: Written date
          example: '20180401'
          pattern: ^((1|2)\d{3}[01][0-9][0-3][0-9]$)
        expiration_date:
          type: string
          description: Expiration date
          example: '20180401'
          pattern: ^((1|2)\d{3}[01][0-9][0-3][0-9]$)
        last_fill_date:
          type: string
          description: Last fill date
          example: '20180401'
          pattern: ^((1|2)\d{3}[01][0-9][0-3][0-9]$)
        first_fill_date:
          type: string
          description: First fill date
          example: '20180401'
          pattern: ^((1|2)\d{3}[01][0-9][0-3][0-9]$)
        number:
          type: string
          example: '4567'
        direct_transfer_url:
          type: string
          example: https://user:securelogin@www.assets.com/rx/saijhofiasjfoasoi2f.png
          x-format:
            uri:
              scheme:
              - https
              - s3
        can_substitute:
          type: boolean
          example: true
        prescribed_ndc:
          type: string
          description: National drug code
          example: '12345678912'
          pattern: ^(\d{10,11})$
        days_supply:
          type: integer
          description: Days supply
          example: 30
        icd10_code:
          type: string
          example: G43.909
        notes:
          type: string
          description: Text note
          example: A note here
        annotation:
          type: string
          description: Short annotation
          example: Hair loss treatment
        diagnosis:
          type: string
          description: Diagnosis
          example: Male pattern baldness
        quantity_transferred:
          type: string
          description: Quantity of medication transferred
          example: '60'
        original_refills:
          type: integer
          description: Original number of refills
          example: 3
      required:
      - medication_name
      - quantity_written
      - medication_sig
      - written_date
      - number
      - can_substitute
    Model97:
      type: object
      properties:
        timestamp:
          type: number
          example: 1631593381
        callback_type:
          type: string
          example: DIRECT_TRANSFER
        details:
          $ref: '#/components/schemas/Model96'
    CreateDirectTransfer:
      type: object
      description: Create new direct transfer
      properties:
        metadata:
          type: string
        prescriber:
          $ref: '#/components/schemas/Prescriber'
        patient_token:
          type: string
          description: Token to reference patient record
          example: 4526d90a
        transfer_from:
          $ref: '#/components/schemas/TransferFrom'
        transfer_to:
          $ref: '#/components/schemas/TransferTo'
        prescription:
          $ref: '#/components/schemas/Model139'
        source:
          type: string
      required:
      - prescriber
      - transfer_from
      - transfer_to
      - prescription
    TransferTo:
      type: object
      description: Pharmacy to transfer prescriptions to
      properties:
        name:
          type: string
          description: Name of pharmacy
          example: Walmart Pharmacy
        dea:
          type: string
        pharmacist:
          type: string
          example: Dr. Storm
        id_number:
          type: string
      required:
      - name
      - pharmacist
    Model138:
      type: object
      properties:
        name:
          type: string
          x-convert:
            trim: true
        street1:
          type: string
          description: Primary street where the company is located
          example: 123 Some Lane
          x-convert:
            trim: true
        city:
          type: string
          description: City where the company is located
          example: San Mateo
          x-convert:
            trim: true
        state:
          type: string
          description: State where the company is located
          example: CA
          x-convert:
            trim: true
        zip:
          type: string
          description: Postal code where the company is located
          example: '94538'
          pattern: ^\d{5}(-\d{4})?$
      required:
      - name
      - street1
      - city
      - state
      - zip
    Model142:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Direct transfer already exists with token 4009e71e42
    icd_codes:
      type: object
    Model49:
      type: object
      properties:
        statusCode:
          type: number
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Unable to find direct transfer.
    Model98:
      type: object
      properties:
        payload:
          $ref: '#/components/schemas/Model97'
        delivery_data:
          $ref: '#/components/schemas/delivery_data'
    Model48:
      type: object
      properties:
        statusCode:
          type: number
          example: 403
        error:
          type: string
          example: Forbidden
        message:
          type: string
          example: Unauthorized from viewing this direct transfer
    Model99:
      type: array
      items:
        $ref: '#/components/schemas/Model98'
    Model100:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/Model99'
    Model47:
      type: object
      properties:
        status:
          type: string
          example: pending
        rejection_reason:
          type: string
        additional_rejection_details:
          type: string
        prescription_token:
          type: string
          example: 61323ceea1da89001d154adc
        metadata:
          type: string
          example: some metadata
        created_at:
          type: string
          example: '2021-09-14T04:49:12.000Z'
    Model143:
      type: object
      properties:
        message:
          type: string
          example: Unable to find Patient.
    Model140:
      type: object
      properties:
        direct_transfer_id:
          type: string
          example: 9a8b9e4161
    TransferFrom:
      type: object
      description: Pharmacy to transfer prescriptions from
      properties:
        name:
          type: string
          description: Name of pharmacy
          example: Walmart Pharmacy
        dea:
          type: string
        pharmacist:
          type: string
          example: Dr. Storm
        id_number:
          type: string
          example: '490382308'
        address:
          $ref: '#/components/schemas/Model138'
      required:
      - name
      - pharmacist
      - id_number
      - address
    Model141:
      type: object
      properties:
        request_id:
          type: string
          example: 40277544de5c6ba685dc4161e189d3e2
        timestamp:
          type: integer
          example: 1631571795.423
        status:
          type: string
          example: success
        details:
          $ref: '#/components/schemas/Model140'
    Model96:
      type: object
      properties:
        metadata:
          type: string
          example: my_identifier
        message:
          type: string
          example: Direct Transfer Accepted.
        patient_token:
          type: string
          example: 221e6f904c32faac
        direct_transfer_token:
          type: string
          example: b5338d53e5
        prescription_token:
          type: string
          example: 622b9f344fa7
        rx_link:
          type: string
          example: rxl_31ad83984d0404f7109f0992
    Prescriber:
      type: object
      description: Prescriber description
      properties:
        prescriber_type:
          type: string
          example: OD
          enum:
          - OD
          - PMHNP
          - MBBS
          - DNP
          - D.O.
          - DPT
          - D.D.S.
          - F.N.P.
          - CPP
          - N.D.
          - P.A.
          - APNP
          - V.M.D.
          - RPh
          - APRN
          - DC APC
          - PsyD
          - CRNA
          - PharmD
          - B.V.M.S.
          - WHNP
          - PhD
          - ARNP
          - PT
          - CRNP
          - DPM
          - CNP
          - N.P.
          - CDH
          - D.M.D.
          - D.V.M.
          - M.D.
          - CNM
        first_name:
          type: string
          description: Prescriber's first name
          example: Stephen
          x-convert:
            trim: true
        last_name:
          type: string
          description: Prescriber's last name
          example: Strange
          x-convert:
            trim: true
        address:
          $ref: '#/components/schemas/Model138'
        dea:
          type: string
        npi:
          type: string
          description: National provider identifier
          example: '123123123'
      required:
      - first_name
      - last_name
      - address
      - npi
  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
x-alt-definitions:
  selected_allergies:
    type: array
    items:
      type: string
  allergies:
    type: object
    properties:
      selected_allergies:
        $ref: '#/x-alt-definitions/selected_allergies'
      presented_allergies:
        $ref: '#/x-alt-definitions/selected_allergies'
      free_form_allergy_information:
        type: string
    required:
    - selected_allergies
    - presented_allergies
    - free_form_allergy_information
  Model1:
    type: object
    properties:
      name:
        type: string
      strength:
        type: number
      dosage:
        type: string
      frequency:
        type: string
    required:
    - name
  medications:
    type: array
    items:
      $ref: '#/x-alt-definitions/Model1'
  Model2:
    type: object
    properties:
      type:
        type: string
      year:
        type: number
      reason:
        type: string
    required:
    - type
    - year
    - reason
  events:
    type: array
    items:
      $ref: '#/x-alt-definitions/Model2'
  patient_consent:
    type: object
    properties:
      consent_statement:
        type: string
      consent_method:
        type: string
      consent_date:
        type: string
      consent_type:
        type: string
      patient_name:
        type: string
      consent_provided_by:
        type: string
      item:
        type: string
  Model3:
    type: object
    properties:
      insurance_token:
        type: string
        description: Insurance token
        example: adcbc795028c009d
        minLength: 1
      prior_authorization_number:
        type: string
        example: ABC123
        pattern: ^[0-9a-zA-Z]{1,35}$
      other_coverage_code:
        type: string
        example: '8'
        pattern: ^[0-8]{1}$
      submission_clarification_code:
        type: string
        example: '3'
        pattern: ^(?:[1-9]\d?|0)$
    required:
    - insurance_token
  claim_overrides:
    type: array
    items:
      $ref: '#/x-alt-definitions/Model3'
  pricing:
    type: object
    properties:
      ingredient_cost_submitted:
        type: number
        x-constraint:
          greater: 0
          precision: 2
  Model4:
    type: object
    properties:
      prescription_token:
        type: string
        description: Prescription token
        example: 4526d90a
        minLength: 1
      quantity:
        type: number
        example: 8.7
      days_supply:
        type: number
        example: 30
      patient_consent:
        $ref: '#/x-alt-definitions/patient_consent'
      claim_overrides:
        $ref: '#/x-alt-definitions/claim_overrides'
      ndc:
        type: string
        description: National drug code
        example: '71858002504'
        pattern: ^[0-9]{10,11}$
      daw:
        type: string
        example: '2'
        enum:
        - '0'
        - '2'
      copay_limit:
        type: number
        minimum: 0
        x-constraint:
          precision: 2
      pricing:
        $ref: '#/x-alt-definitions/pricing'
    required:
    - prescription_token
    - daw
  insurance_token:
    type: array
    example:
    - skhsyq83rkd3uht9
    - ubqfc1a0a17hjb1c
    - oi4aafwcsv5zzvvj
    minItems: 1
    items:
      type: string
  copay_payment:
    type: object
    properties:
      cardholder_name:
        type: string
        description: Cardholder name
        example: John Doe
      payment_type:
        type: string
      last_four_digits:
        type: string
        example: '4132'
      transaction_amount:
        type: number
      card_type:
        type: string
      transaction_date:
        type: string
      transaction_id:
        type: string
    required:
    - payment_type
  Medication:
    type: object
    description: Medication description
    example:
    - prescription_token: z3q2jr
    - prescription_token: 3cs873
    properties:
      medication_name:
        type: string
