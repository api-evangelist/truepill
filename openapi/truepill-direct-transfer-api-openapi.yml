  /api/v1/direct_transfer:
    post:
      summary: Create Direct Transfer
      operationId: postApiV1Direct_transfer
      description: 'Create a direct pharmacy-to-pharmacy transfer of the prescription


        A direct transfer is a pharmacy-to-pharmacy transfer of the prescription between your pharmacy and a Truepill pharmacy. This method works best for customers that operate their own pharmacies and are looking for a programmatic way to transfer a prescription.


        And similar to a traditional transfer request, there are required fields related to the pharmacist transferring out the prescription, and the pharmacist transferring in the prescription.


        This approach requires a digital copy of the original prescription.'
      tags:
      - Direct Transfer
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model141'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model142'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model143'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectTransfer'
