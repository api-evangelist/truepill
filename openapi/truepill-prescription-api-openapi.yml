info:
  title: Truepill API documentation Prescription API
  version: 0.0.1
  description: DOCS
servers:
- url: https://rxapi.fuzehealth.com/
- url: http://rxapi.fuzehealth.com/
security:
- apiKey: []
tags:
- name: Prescription
paths:
  /v1/prescription/{token}:
    get:
      summary: Get Prescription by token
      operationId: getV1PrescriptionToken
      description: 'Once a specific prescription is in the Truepill ecosystem -- either via eRx, Direct Transfer or Transfer -- the prescription information can be retrieved at any time through an API request.


        This endpoint requires a prescription_token. You will receive a prescription_token through one of the following scenarios:


        A Notify-Rx callback which is sent when a prescription is received by the pharmacy through SureScripts


        A Direct Transfer callback which is sent when a Direct Transfer has been successfully processed


        A Transfer callback which is sent when a Transfer has been successfully processed'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      tags:
      - Prescription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model62'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model63'
