      summary: Get a list of all prescriptions currently subscribed to auto-refill for a given patient
      operationId: getApiV1AutorefillPatientPatient_token
      tags:
      - prescriptions
      parameters:
      - name: patient_token
        in: path
        required: true
        schema:
          type: string
