components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key passed in the Authorization header. Separate keys are issued for sandbox and
        production.
  schemas:
    Model106:
      type: object
      properties:
        xml:
          type: string
    Model110:
      type: object
      properties:
        patient_copay_amount:
          type: number
          description: Expected patient copay amount from claim if adjudication is successful
          example: 10
        transaction_code:
          type: string
          description: Adjudication transaction type
          example: B2
        claim_type:
          type: string
          description: Insurance claim type
          example: Reversal
        transmission_date:
          type: string
          format: date
          example: '2021-09-15T03:07:01.000Z'
        insurance:
          $ref: '#/components/schemas/insurance'
        payor:
          type: string
          description: Payor's name
          example: Health Partners
        payor_adjudication_amount:
          type: number
          description: Payor adjudication amount
          example: 0
    Model111:
      type: array
      items:
        $ref: '#/components/schemas/Model110'
    Model112:
      type: object
      properties:
        statusCode:
          type: number
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Unable to find Rx.
    Model15:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/data'
    Model16:
      type: object
      properties:
        message:
          type: string
          example: An example error message
    Model17:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: '2021-05-20T00:00:00.000Z'
        status:
          type: string
          example: unsuccessful
        details:
          $ref: '#/components/schemas/Model16'
    Model18:
      type: object
      properties:
        code:
          type: number
          example: 400
        err:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Model17'
    Model19:
      type: object
      properties:
        code:
          type: number
          example: 500
        err:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Model17'
    Model206:
      type: object
      properties:
        auto_refill_id:
          type: number
          description: ID of the newly created auto refill subscription.
        auto_refill_date:
          type: string
          format: date
          description: Date the next refill will be filled.
          example: '2021-07-31T00:00:00.000Z'
    Model207:
      type: object
      properties:
        auto_refill_medications:
          $ref: '#/components/schemas/Model206'
    Model208:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: '2021-05-20T00:00:00.000Z'
        status:
          type: string
          example: successful
        details:
          $ref: '#/components/schemas/Model207'
    Model209:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model208'
    Model225:
      type: object
      properties:
        sas_id:
          type: string
          example: 985c7f9f-b506-424a-b016-0a47144f46b6
    Model226:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model225'
    Model227:
      type: object
      properties:
        reason:
          type: string
          example: Discontinuation of therapy
      required:
      - reason
    Model228:
