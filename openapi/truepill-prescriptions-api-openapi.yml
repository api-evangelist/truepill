    prescription:
      type: object
      properties:
        prescription_token:
          type: string
          description: Token to reference the prescription
          example: 7af31c1d350d
        fillable:
          type: boolean
          description: Is this prescription fillable
          example: true
        is_refill:
          type: number
          description: Is prescription a refill or new fill
          example: 0
        rx_number:
          type: string
          description: Rx number of prescription
          example: '1111111'
        prescribed_drug_strength:
          type: string
          description: Drug strength prescribed
          example: 20 mg
        prescribed_written_name:
          type: string
          description: Name of medication prescribed as written
          example: Cialis 20 Mg Tablet
        prescribed_quantity:
          type: number
          description: Quantity of prescribed medication
          example: 10
        prescribed_quantity_unit:
          type: string
          description: Unit for the prescribed medication quantity
          example: tablets
        prescribed_ndc:
          type: string
          description: NDC of prescribed medication
          example: '00002446430'
        medication_sig:
          type: string
          description: Instructions for taking medication
          example: Take one tablet by mouth 45-60 minutes prior to sexual activity. Take no more than
            once per day.
        prescriber:
          type: string
          description: Name of prescriber
          example: Dr. Doctor Doctor
        prescriber_npi:
          type: string
          description: NPI of prescriber
          example: '1111111111'
        date_written:
          type: string
          format: date
          description: When the prescription was written
          example: '2021-06-30T00:00:00.000Z'
        days_supply:
          type: string
          description: Number of days the medication covers
          example: '30'
        number_of_refills_allowed:
          type: number
          description: Number of refills allowed for prescription
          example: 2
        refills_remaining:
          type: number
          description: Number of refills on this prescription
          example: 2
        quantity_remaining:
          type: number
          description: Quantity of doses remaining on prescription
          example: 30
        current_rx_status_text:
          type: string
          description: Current status of the prescription
          example: Active
        rx_link:
          type: string
          description: URL link to the prescription details
          example: rxl_cf1b5ce299ee432192b681d
        medication_id:
          type: string
          description: Unique medication ID
          example: ec09a90
        prescribed_brand_name:
          type: string
          description: Name of medication prescribed
          example: Cialis
        expiration_date_utc:
          type: string
          format: date
          description: When the prescription will expire
          example: '2022-06-30T07:00:00.000Z'
        expiration_date:
          type: string
          format: date
          description: When the prescription will expire
          example: '2022-06-30T07:00:00.000Z'
        medication_name:
          type: string
          description: Name of the prescribed medication
          example: Cialis
        prescribed_generic_name:
          type: string
          description: Name of generic medication prescribed
          example: tadalafil 20 mg tablet
        formulary:
          $ref: '#/components/schemas/formulary'
        origin:
          type: string
          description: Original source of prescription
          example: Electronic
        prescriber_order_number:
          type: string
          description: Prescriber order number of escript
          example: '2222222'
        date_filled_utc:
          type: string
          format: date
          description: Date and time when the prescription was filled, in UTC
          example: '2021-06-30T00:00:00.000Z'
        last_filled_date:
          type: string
          format: date
          description: When prescription was last filled
          example: '2021-06-30T00:00:00.000Z'
        original_prescribed_ndc:
          type: string
          description: Original National Drug Code if different from prescribed
          example: '00002446430'
        prescriber_address:
          $ref: '#/components/schemas/Prescriber%20Address%20details'
        notes:
          type: string
          description: Prescription notes associated with Rx
          example: A note
        icd_codes:
          $ref: '#/components/schemas/icd_codes'
        is_daw:
          type: boolean
          description: Is prescription dispense-as-written
          example: false
        dea_schedule:
          type: number
          description: Controlled Substance Act drug schedule
          example: 0
        direct_transfer_token:
          type: string
          example: b5338d53e5
        originator:
          type: string
          example: surescripts
      required:
      - prescription_token
      - fillable
      - is_refill
      - rx_number
      - prescribed_drug_strength
      - prescribed_written_name
      - prescribed_quantity
      - prescribed_quantity_unit
      - prescribed_ndc
      - medication_sig
      - prescriber
      - prescriber_npi
      - date_written
      - days_supply
      - number_of_refills_allowed
      - refills_remaining
      - quantity_remaining
      - current_rx_status_text
      - rx_link
