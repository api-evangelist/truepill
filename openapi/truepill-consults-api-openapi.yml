          description: Date of birth
          example: '2000-01-01'
          pattern: ^((1|2)\d{3}-[01][0-9](?<!00)-[0-3][0-9](?<!00)$)
        home_zip:
          type: string
          description: Patient home zip
          example: '94538'
          pattern: ^\d{5}(-\d{4})?$
        preferred_contact:
          type: string
          example: email
          enum:
          - email
          - phone
          - sms
        contacts:
          $ref: '#/components/schemas/contacts'
        payment:
          $ref: '#/components/schemas/payment'
        current_medications:
          $ref: '#/components/schemas/Current%20medication'
        identification:
          $ref: '#/components/schemas/identification'
      required:
      - last_name
      - gender
      - dob
      - home_zip
      - preferred_contact
      - preferred_contact
