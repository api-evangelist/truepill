  /v1/webhook_events/{webhook_type}:
    get:
      summary: List NotifyRx Webhook Events
      operationId: getV1Webhook_eventsWebhook_type
      description: 'Webhook Events can be retrieved via API to be reprocessed.


        This endpoint returns a list of webhook events and allows for the use of query parameters to scope the results of the request. A request `payload` represents the request''s timestamp, type, and details. A request''s `delivery_data` represents the request''s status information.


        Supported `webhook_types` are `notify_rx`'
      parameters:
      - name: webhook_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - notify_rx
          - FILE
          - CONSULT
          - CONSULT_TASK
          - CONTACT
          - TRANSFER_OUT
          - VISIT
      - x-alternatives:
        - type: string
        - type: array
          items:
            type: string
          collectionFormat: multi
          name: timestamp
        name: timestamp
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: request_id
        in: query
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model74'
