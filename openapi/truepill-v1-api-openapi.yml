        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model23'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model24'
    put:
      summary: Create Patient
      operationId: putV1Patient
      description: 'This endpoint generates a patient record in the Truepill ecosystem.


        Upon a successful request, the endpoint returns a `patient_token` for you to reference in subsequent API requests that require this field.


        The `patient_token` that is returned upon successfully creating a patient record can be used with many of the other endpoints to continue referencing the same record.


        If the patient information in the request body matches the information in an existing patient record, the existing `patient_token` will be returned in the API response.


        The address and phone number provided should be the same as the information provided to the prescriber on the e-Script. These attributes are only used for matching purposes.'
      tags:
      - v1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model231'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model234'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model230'
