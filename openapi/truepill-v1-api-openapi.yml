openapi: 3.2.0
info:
  title: Truepill API documentation V1 API
  version: 0.0.1
  description: DOCS
servers:
- url: https://rxapi.fuzehealth.com/
- url: http://rxapi.fuzehealth.com/
security:
- apiKey: []
tags:
- name: v1
paths:
  /v1/auto-refill:
    get:
      summary: Get a list of all prescriptions currently subscribed to auto-refill
      operationId: getV1Autorefill
      tags:
      - v1
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model15'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model18'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model19'
  /v1/availability:
    get:
      summary: Get NDC availability
      operationId: getV1Availability
      tags:
      - v1
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v1/external_location_matches:
    get:
      summary: Search for specific external location using address information
      operationId: getV1External_location_matches
      tags:
      - v1
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
    post:
      summary: Query external locations for multiple addresses, and will reply back with a map…
      operationId: postV1External_location_matches
      tags:
      - v1
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v1/external_locations:
    get:
      summary: Search for external locations using zip code
      operationId: getV1External_locations
      tags:
      - v1
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /v1/fill_requests:
    get:
      summary: Get a list of fill requests
      operationId: getV1Fill_requests
      description: Returns a list of fill requests and allows for the use of query parameters to scope the results of the request
      parameters:
      - name: created_at
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: number
          maximum: 100
      - name: next
        in: query
        schema:
          type: string
      - name: metadata
        in: query
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          description: OK
          content:
            application/json:
