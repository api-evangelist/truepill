components:
  schemas:
    Model248:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model247'
    Model41:
      type: object
      properties:
        auto_refill_medications:
          $ref: '#/components/schemas/auto_refill_medications'
        scheduled_fill_address:
          $ref: '#/components/schemas/scheduled_fill_address'
        scheduled_fill_survey:
          $ref: '#/components/schemas/scheduled_fill_survey'
    Model92:
      type: array
      example:
      - id: 1
        prescription_token: token
        status: active
      items:
        type: string
    Model42:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: '2026-08-07T19:45:22.707Z'
        status:
          type: string
          example: successful
        details:
          $ref: '#/components/schemas/Model41'
    Model225:
      type: object
      properties:
        sas_id:
          type: string
          example: 985c7f9f-b506-424a-b016-0a47144f46b6
    Model19:
      type: object
      properties:
        code:
          type: number
          example: 500
        err:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Model17'
    Model95:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model94'
    Model18:
      type: object
      properties:
        code:
          type: number
