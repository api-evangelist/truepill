        err:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Model17'
    Model15:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/data'
    scheduled_fill_address:
      type: object
      properties:
        name:
          type: string
          example: address name
        street1:
          type: string
          example: street 1
        street2:
          type: string
          example: street 2
        city:
          type: string
          example: city
        state:
          type: string
          example: state
        zip:
          type: number
          example: 12345
        phone:
          type: string
          example: ((123)456-7890
        email:
          type: string
          example: email@email.com
        country:
          type: string
    Model17:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: '2021-05-20T00:00:00.000Z'
        status:
          type: string
          example: unsuccessful
        details:
          $ref: '#/components/schemas/Model16'
    details:
      type: object
      properties:
        auto_refill_subscriptions:
          $ref: '#/components/schemas/auto_refill_subscriptions'
    Model207:
      type: object
      properties:
        auto_refill_medications:
          $ref: '#/components/schemas/Model206'
    Model226:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model225'
    Model43:
      type: object
      properties:
        code:
          type: number
          example: 200
        err:
          type: boolean
          example: false
        data:
          $ref: '#/components/schemas/Model42'
    scheduled_fill_survey:
      type: object
      properties:
        patient_token:
          type: string
        url_token:
          type: string
        created_at:
          type: string
          format: date
        updated_at:
          type: string
          format: date
        asthma_breathing:
          type: number
        heart_disease:
          type: number
        arthritis:
          type: number
        lung_disorder:
          type: number
        bleeding_clotting_disorder:
          type: number
        neurological_chronic_headaches:
          type: number
        blood_transfusion:
          type: number
        psychiatric_disorder:
          type: number
        bowel_stomach:
          type: number
        pulmonary_embolism:
          type: number
        cancer:
          type: number
        stroke:
          type: number
        cholesterol_disorder:
          type: number
        seizure_epilepsy:
          type: number
        diabetes:
          type: number
        thyroid_disorder:
          type: number
        eye_disorder:
          type: number
        urinary_kidney_disorder:
          type: number
        conditions:
          type: number
        smoking_frequency:
          type: number
        drinking_frequency:
          type: number
        other_medications:
          type: number
        known_allergies:
          type: number
        pregnancy:
          type: boolean
    Model206:
      type: object
      properties:
        auto_refill_id:
          type: number
          description: ID of the newly created auto refill subscription.
        auto_refill_date:
          type: string
          format: date
          description: Date the next refill will be filled.
          example: '2021-07-31T00:00:00.000Z'
    auto_refill_subscriptions:
      type: object
      properties:
        id:
          type: number
          example: 1
        prescription_token:
          type: string
          example: token
        patient_token:
          type: string
          example: token
        status:
          type: string
          example: active
    Model208:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: '2021-05-20T00:00:00.000Z'
        status:
          type: string
          example: successful
        details:
