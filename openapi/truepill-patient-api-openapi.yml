  /v1/patient/{patient_token}:
    get:
      summary: Get Patient
      operationId: getV1PatientPatient_token
      description: 'Once a patient has been created in the Truepill ecosystem, you can access the patient information at any time using the `patient_token` that was provided on the Create Patient response.


        If the `patient_token` does not map to a patient record, a `404 Not Found` will be returned.


        Querying for patient information that does not belong to you will return an error response.


        Patient SSN and `id_image` information is not viewable through this endpoint'
      parameters:
      - name: patient_token
        in: path
        required: true
        schema:
          type: string
      tags:
      - Patient
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model58'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model24'
    post:
      summary: Update Patient
      operationId: postV1PatientPatient_token
      description: 'This endpoint updates a patient record in the Truepill ecosystem.


        Upon a successful request, the endpoint returns the `patient_token` of the patient updated, the timestamp, the status, and a message.


        Only non-required fields can be updated. Submitting a patient''s first name, last name, date of birth, or gender as a field to be updated will be considered a bad request.'
      parameters:
      - name: patient_token
        in: path
        required: true
        schema:
          type: string
      tags:
      - Patient
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model221'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
