          example: '90'
        is_refill:
          type: number
          description: Is prescription a refill or new fill?
          example: 0
        last_filled_date:
          type: string
          format: date
          description: When prescription was last filled (null if not)
          example: '2022-08-03T13:09:27.000Z'
        expiration_date_utc:
          type: string
          format: date
          description: When the prescription will expire
          example: '2022-09-11T13:09:27.000Z'
        medication_sig:
          type: string
          description: Instructions for taking medication
          example: Use as directed for 90 days.
        number_of_refills_allowed:
          type: string
