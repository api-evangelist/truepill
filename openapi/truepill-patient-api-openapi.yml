openapi: 3.2.0
info:
  title: Truepill API documentation Patient API
  version: 0.0.1
  description: DOCS
servers:
- url: https://rxapi.fuzehealth.com/
- url: http://rxapi.fuzehealth.com/
security:
- apiKey: []
tags:
- name: Patient
paths:
  /v1/patient:
    get:
      summary: Patient search
      operationId: getV1Patient
      description: 'While the Get Patient endpoint requires a `patient_token` to retrieve information, you can also retrieve patient information without a `patient_token`, using the Find Patient endpoint.


        Search for patient information by appending the following param fields onto the API endpoint, separated with an `&`:'
      parameters:
      - name: guardian
        in: query
        schema:
          type: string
      - description: Patient title
        name: prefix
        in: query
        schema:
          type: string
          enum:
          - Mr.
          - Ms.
          - Mrs.
          - Miss
          - Ms
          - Prof
          - Sir
      - description: Suffix which qualifies a person
        name: suffix
        in: query
        schema:
          type: string
          enum:
          - Jr.
          - Sr.
          - I
          - II
          - III
          - IV
          - V
      - description: Patient first name
        x-convert:
          trim: true
        name: first_name
        in: query
        required: true
        schema:
          type: string
      - description: Patient last name
        x-convert:
          trim: true
        name: last_name
        in: query
        required: true
        schema:
          type: string
      - description: Patient gender
        name: gender
        in: query
        required: true
