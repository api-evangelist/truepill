          type: string
          enum:
          - male
          - female
          - unknown
      - description: Patient's date of birth
        name: dob
        in: query
        required: true
        schema:
          type: string
          format: date
      - description: Postal code where the company is located
        name: zip
        in: query
        schema:
          type: string
          pattern: ^\d{5}(-\d{4})?$
