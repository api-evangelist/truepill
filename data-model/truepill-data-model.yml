provider: Truepill
providerId: truepill
summary: >-
  The FuzeRx data model is a token graph. Every entity is addressed by an opaque string token rather
  than a numeric id, and the published rationale is explicit — tokens "ensure we limit the amount of
  sensitive and patient-identifiable data sent using webhook events". Patient is the root: a
  patient_token appears in 27 schema definitions across the contract, more than twice any other
  reference. Prescription hangs off Patient, and every downstream request object (fill request,
  copay request, transfer, order, consult, diagnostics order) references Patient and/or Prescription
  rather than embedding them. There are no $ref-linked entity schemas in the published Swagger to
  traverse — the source contract names its object schemas Model23, Model104, Model230 and so on, so
  the relationships below are derived from the id-reference FIELDS and the path hierarchy, which is
  the only structure the provider actually exposes.
caveats:
- >-
  The provider's Swagger uses generated schema names (Model1..Model280+) with no semantic entity
  names, so entity naming here is API Evangelist's, taken from the path segments and token field
  names, not from the provider's own vocabulary.
- >-
  Relationship cardinality is inferred from path nesting and field plurality. Where the contract is
  silent the relationship is recorded with confidence: medium.
id_conventions:
  style: opaque string token
  naming: <entity>_token
  formats:
  - entity: patient
    field: patient_token
    example: a35be240f1f5da6b
    length: 16 hex chars (observed in spec examples)
  - entity: prescription
    field: prescription_token
    example: deb071563ead
  - entity: fill request
    field: url_token
    note: the fill request is addressed by url_token, not fill_request_token
  - entity: request (generic async)
    field: request_id
    example: fill_request_991e90fa6b367cf72032
    note: '<object-type>_<hex token> — the join key between a synchronous response and its later webhook events'
  - entity: insurance
    field: insurance_token
  - entity: prescriber
    field: prescriber_token
  - entity: direct transfer
    field: direct_transfer_token
  - entity: transfer
    field: transfer_token
  - entity: order
    field: order_token
  - entity: consult
    field: consult_id
  - entity: diagnostics order
    field: order_id
  - entity: diagnostics kit
    field: kit_id
  - entity: media
    field: id
