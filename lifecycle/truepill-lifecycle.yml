changelog:
  published: false
  note: >-
    No changelog, release-notes, or "what's new" surface exists on
    rxdocs.fuzehealth.com, rx.fuzehealth.com or fuzehealth.com. The published
    Swagger reports info.version "0.0.1" and carries no dates, so a consumer has
    no way to detect that the contract changed. No changelog/ artifact is emitted.
