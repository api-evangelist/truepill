company_lifecycle:
  note: >-
    Truepill was acquired by LetsGetChecked in 2024 and the combined company
    rebranded as Fuze Health in May 2025; the developer platform now ships as
    FuzeRx. The truepill.com brand host and status.truepill.com both still
    resolve and redirect into the fuzehealth.com estate, and the live API host
    still returns keys prefixed tp_live_key_ / tp_test_key_.
