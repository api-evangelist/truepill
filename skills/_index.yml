cross_cutting_rules:
  note: Every skill above restates these because they are the rules an agent gets wrong on this API.
  rules:
  - PUT /v1/patient CREATES; POST /v1/patient/{patient_token} UPDATES.
  - No idempotency key exists. Never blind-retry a POST — poll or read the webhook feed instead.
  - R1, TRANSFER_DUPLICATE and DUPLICATE_REQUEST mean the FIRST attempt landed.
  - A 200/202 means accepted, not completed. The outcome arrives as a webhook event.
  - Webhook events are unsigned; treat the pull feed as the system of record.
  - Tokens are environment-scoped; a sandbox token 404s against production.
