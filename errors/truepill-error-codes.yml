method: searched
source: https://rxdocs.fuzehealth.com (Transfer Error Codes, Order Error Codes, Triage Codes)
provider: Truepill
providerId: truepill
summary: >-
  FuzeRx's operational failures are not HTTP errors — they arrive later, as
  rejection and triage webhook events. Each carries a code in `error_code` (or
  `code` for triage), a human description in `description`, and optional detail in
  `message` / `additional_information`. These are the codes an integration must
  branch on; the HTTP envelope in errors/truepill-problem-types.yml only reports
  whether the request was accepted.
envelope:
  rejection:
    callback_type: TRANSFER | TRANSFER_CONTACT | DIRECT_TRANSFER | ORDER
    status: error
    fields:
    - details.error_code
    - details.description
    - details.message
  triage:
    callback_type: ORDER
    status: triage
    fields:
    - details.code
    - details.description
    - details.additional_information
    note: An order may be triaged multiple times; each occurrence emits its own webhook event.
catalogs:
- name: Transfer Error Codes
  applies_to:
  - POST /v1/transfer_request
  - POST /v1/direct_transfer
  - POST /v2/direct_transfer
  surface: TRANSFER and TRANSFER_CONTACT rejection webhook events
  codes:
  - code: RX_DOSAGE_MISMATCH
    description: Dosage doesn't match prescription
  - code: RX_FORMULA_MISMATCH
    description: Formulation doesn't match prescription
  - code: RX_NO_REFILLS
    description: No refills remaining
  - code: RX_NONEXISTANT
    description: Prescription doesn't exist at specified pharmacy
  - code: RX_EXPIRED
    description: Prescription has expired
  - code: RX_IS_DAW
    description: Prescription is dispense as written for brand
  - code: PATIENT_RECORD_NONEXISTANT
    description: No patient record at pharmacy
  - code: PATIENT_CANCELLED_RX
    description: Patient cancellation request
  - code: PATIENT_INFO_MISMATCH
    description: Patient information doesn't match prescription
  - code: PATIENT_CONTACT_REQUESTED
    description: Pharmacy/prescriber requesting patient contact
  - code: PHARMACY_NO_RESPONSE
    description: Pharmacy did not respond after 6 days
  - code: PHARMACY_DECLINED
    description: Pharmacy refuses transfer
  - code: PRESCRIBER_DECLINED
    description: Prescriber declined to provide prescription
  - code: PRESCRIBER_NO_RESPONSE
    description: Prescriber did not respond after 6 days
  - code: TRANSFER_DUPLICATE
    description: Duplicate transfer
    note: Also the de-facto duplicate-suppression signal — see conventions/truepill-conventions.yml.
  - code: TRANSFER_CONTACT_INFO_INCORRECT
    description: Incorrect pharmacy/prescriber contact information
  - code: TRANSFER_OTHER_REASON
    description: Other reason
    message: Rejection specifics
