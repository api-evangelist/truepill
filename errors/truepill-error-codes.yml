- name: Order Triage Codes
  applies_to:
  - POST /v1/fill_request
  - POST /v1/order
  surface: ORDER webhook events with status = triage
  semantics: >-
    Not a terminal failure. The order is blocked on an external dependency and is
    expected to be resolved by pharmacy staff; do not cancel and resubmit.
