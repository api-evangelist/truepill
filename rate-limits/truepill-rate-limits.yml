specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Truepill
providerId: truepill
created: '2026-06-21'
modified: '2026-08-15'
method: searched
source: >-
  https://rxdocs.fuzehealth.com, https://rx.fuzehealth.com/api-docs and the live Swagger contract at
  https://rxapi.fuzehealth.com/swagger.json — re-checked 2026-08-15. No rate limit, quota, throttle
  or concurrency figure is published anywhere, and no rate-limit response header (X-RateLimit-*,
  RateLimit-*, Retry-After) is declared on any of the 158 operations in the contract.
limit_count: 0
limit_count_note: >-
  limit_count is 0 because the provider publishes NO numeric limits. The entries below name the
  surfaces a limit would apply to and record that each is undocumented — they are not published
  values. The 429 in responseCodes is the conventional expectation, NOT an observed or documented
  behaviour of this API.
headers_published: []
headers_note: >-
  An agent gets no runtime rate-limit signal from this API at all. There is nothing to read on a
  response to decide whether to back off, which matters more here than the missing numbers.
reconciled: false
tags:
- Pharmacy
- Healthcare
- Prescription Fulfillment
- Insurance
- Rate Limiting
- Quotas
- Throttling
description: >-
  Truepill (FuzeRx) does not publish specific public rate limits or quotas for
  its REST API. The platform is gated behind a commercial agreement with
  separate sandbox and production API keys, and limits are expected to be
  governed by contract and account configuration rather than a published
  rate card. No per-endpoint RPM/RPD/quota values are documented to reconcile.
notes: >-
  Confirm applicable throttling, concurrency, and quota limits with Truepill /
  Fuze Health during onboarding. Standard HTTP 429 throttling and exponential
  backoff with Retry-After should be assumed but are not explicitly documented.
sources:
- https://rxdocs.fuzehealth.com
- https://www.truepill.com
responseCodes:
  throttled: 429
limits:
- name: Account Request Rate
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Not publicly documented; governed by commercial agreement and API key configuration.
- name: Copay / Insurance Adjudication
  scope: account
  metric: claims
  limit: see provider documentation
  notes: Copay requests may be subject to payor- and contract-specific limits.
- name: Webhook Event Retrieval
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Polling limits for webhook_events endpoints are not publicly documented.
policies:
- name: Contract-Governed Limits
  description: Limits are set per commercial agreement and account, not via a public tier system.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After if returned.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
